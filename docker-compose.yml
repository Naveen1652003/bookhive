version: '3.8'

services:
  # Database Service (PostgreSQL)
  postgres:
    image: postgres:16-alpine
    container_name: bookhive-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bookhive
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - bookhive-network

  # Cache Service (Redis)
  redis:
    image: redis:7-alpine
    container_name: bookhive-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - bookhive-network

  # Database Admin Dashboard (pgAdmin)
  pgadmin:
    image: dpage/pgadmin4
    container_name: bookhive-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@bookhive.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - bookhive-network

  # Backend REST API Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: bookhive-backend
    restart: always
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/bookhive?schema=public"
      REDIS_URL: "redis://redis:6379"
      JWT_SECRET: "bookhive_jwt_secret_token_super_private_321"
      REFRESH_SECRET: "bookhive_refresh_secret_token_extra_private_987"
      SHOPIFY_API_KEY: "placeholder_api_key"
      SHOPIFY_API_SECRET: "placeholder_api_secret"
      SHOPIFY_ACCESS_TOKEN: "placeholder_access_token"
      SHOPIFY_STORE_URL: "placeholder_shop.myshopify.com"
      AWS_ACCESS_KEY_ID: "placeholder_aws_key"
      AWS_SECRET_ACCESS_KEY: "placeholder_aws_secret"
      AWS_BUCKET: "bookhive-images"
    ports:
      - "5000:5000"
    depends_on:
      - postgres
      - redis
    networks:
      - bookhive-network

  # Frontend Static Service (Nginx)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: bookhive-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - bookhive-network

volumes:
  postgres_data:
  redis_data:

networks:
  bookhive-network:
    driver: bridge
